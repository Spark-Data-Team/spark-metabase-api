name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Suite hors-ligne
        run: pytest -q
